name: local-reference-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  provider-local-smoke:
    name: local-${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - provider: cirq
            extra: cirq
          - provider: braket
            extra: braket
          - provider: quera
            extra: braket
          - provider: rigetti
            extra: rigetti
          - provider: quantinuum
            extra: quantinuum
          - provider: pasqal
            extra: pasqal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,${{ matrix.extra }}]"
      - run: python scripts/run_provider_smoke.py "${{ matrix.provider }}" --shots 512
