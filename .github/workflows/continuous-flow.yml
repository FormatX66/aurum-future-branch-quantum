name: continuous-variable-flow

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-continuous-variable-flow
  cancel-in-progress: false

jobs:
  active-provider-sweep:
    name: flow-${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - provider: google
            extra: cirq
          - provider: microsoft
            extra: microsoft
    steps:
      - uses: actions/checkout@v7
      - name: Checkout canonical Aurum seed build
        uses: actions/checkout@v7
        with:
          repository: FormatX66/BoxBrain
          ref: main
          path: aurum-seed-source
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install active provider stack
        run: python -m pip install -e ".[${{ matrix.extra }}]"
      - name: Run rotating variable field
        shell: bash
        run: |
          seed_commit="$(git -C aurum-seed-source rev-parse HEAD)"
          python scripts/run_continuous_sweep.py "${{ matrix.provider }}" \
            --cycle "${{ github.run_number }}" \
            --cases-per-run 9 \
            --aurum-build-manifest "aurum-seed-source/Projects/Aurum/Release/latest-tinyseed-handoff.json" \
            --future-branch-seed "aurum-seed-source/Prompts/FutureBranchSeed.txt" \
            --seed-source-commit "$seed_commit" \
            --output "evidence/${{ matrix.provider }}/results.json" \
            --summary "evidence/${{ matrix.provider }}/summary.md"
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f "evidence/${{ matrix.provider }}/summary.md" ]]; then
            cat "evidence/${{ matrix.provider }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: continuous-flow-${{ matrix.provider }}-${{ github.run_id }}
          path: evidence/${{ matrix.provider }}/
          if-no-files-found: warn
          retention-days: 30
