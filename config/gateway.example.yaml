version: 1

gateway:
  default_execution: local_reference
  continuous_flow:
    enabled: true
    schedule_utc: "17 */4 * * *"
    aurum_seed_authority:
      repository: https://github.com/FormatX66/BoxBrain
      ref: main
      build_manifest: Projects/Aurum/Release/latest-tinyseed-handoff.json
      future_branch_seed: Prompts/FutureBranchSeed.txt
      unknown_schema_action: refuse
      mix_build_fingerprint_into_every_case: true
    active_providers:
      - google
      - microsoft
    cases_per_provider_run: 9
    full_variable_coverage_runs: 5
    variables:
      workloads:
        - bell
        - ghz3
        - rotation
      shots:
        - 64
        - 256
        - 1024
      seeds:
        - 7
        - 23
        - 101
      rotation_quarters:
        - 1
        - 2
        - 3
    evidence_retention_days: 30
    live_qpu_submission:
      automatic: false
      explicit_spending_approval_required: true
    high_failure_router:
      enabled: true
      strict_failure_classes:
        - partial
        - miss
      escalation_threshold: 0.50
      formulation: ranked-branch-amplitude-sampling
      max_machine_paths: 8
      max_shots: 256
      qpu_scope: branch-ranking-and-preparation-only
      may_authorize_physical_or_irreversible_effects: false
  continuation:
    human_boundary_scope: lane_only
    continue_independent_lanes: true
    continue_safe_preparation: true
    continue_external_observation: true
    ask_human_only_when_no_machine_route_remains: true
  qpu_execution:
    enabled: true
    high_failure_paths_only: true
    automatic_scheduled_submission: false
    explicit_confirmation_required: true
    max_shots_per_smoke_job: 1024
  evidence:
    require_local_reference: true
    require_submission_manifest: true
    require_backend_and_job_id: true

providers:
  local_provider_stacks:
    credential_free: true
    max_parallel: 6
    stacks:
      - cirq
      - amazon_braket
      - quera_ahs
      - pyquil
      - pytket
      - pulser

  amazon_braket:
    auth: aws_identity
    qpu_enabled: false

  quantinuum:
    auth: quantinuum_identity
    qpu_enabled: false

  azure_quantum:
    auth: azure_identity_and_subscription
    account_reported_ready: true
    local_qdk_stack_ready: true
    github_workload_identity_configured: false
    qpu_enabled: false

  ionq:
    auth: ionq_identity
    qpu_enabled: false

  rigetti:
    local_stack_ready: true
    qpu_enabled: false

  quera:
    local_ahs_stack_ready: true
    qpu_enabled: false

  pasqal:
    local_pulser_stack_ready: true
    qpu_enabled: false

  ibm_quantum:
    control_plane_verified: true
    auth:
      api_key_file_env: IQP_API_KEY_FILE
      api_key_json_field: apikey
      service_crn_env: IBM_QUANTUM_CRN
      auto_discover_single_instance: true
    qpu_enabled: true
    route: manually_confirmed_high_failure_probe

  google_quantum_engine:
    account_reported_ready: true
    cloud_project_configured: true
    project_env: GOOGLE_CLOUD_PROJECT
    github_workload_identity_configured: false
    qpu_enabled: false
