[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-future-branch-quantum"
version = "0.1.0"
description = "Provider-neutral, safety-gated quantum test harness for Aurum Future Branch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "qiskit==2.5.2",
  "qiskit-ibm-runtime==0.49.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]
cirq = ["cirq-core==1.7.0"]
microsoft = ["qdk==1.31.0"]
braket = ["amazon-braket-sdk==1.126.0"]
rigetti = ["pyquil==4.18.0"]
quantinuum = ["pytket==2.18.1"]
pasqal = ["pulser==1.9.0", "pulser-simulation==1.9.0"]
provider-simulators = [
  "cirq-core==1.7.0",
  "qdk==1.31.0",
  "amazon-braket-sdk==1.126.0",
  "pyquil==4.18.0",
  "pytket==2.18.1",
  "pulser==1.9.0",
  "pulser-simulation==1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
