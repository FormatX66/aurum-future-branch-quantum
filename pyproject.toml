[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-future-branch-quantum"
version = "0.1.0"
description = "Provider-neutral, safety-gated quantum test harness for Aurum Future Branch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "qiskit==2.5.2",
  "qiskit-ibm-runtime==0.49.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

